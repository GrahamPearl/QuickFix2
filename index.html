<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hillcrest High School — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div id="loginGate" class="login-gate is-hidden">
    <div class="login-card">
      <div class="crest" aria-hidden="true">HHS</div>
      <h2 class="login-title">Staff sign in</h2>
      <p class="login-hint">Sign in with your school account.</p>
      <form id="authForm" novalidate>
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" required autocomplete="username" />
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" required autocomplete="current-password" />
        <p id="authError" class="error-text"></p>
        <button type="submit" id="authSubmit" class="btn btn-primary btn-block">Sign in</button>
      </form>
    </div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <div class="crest" aria-hidden="true">HHS</div>
      <div>
        <h1 class="site-title">Hillcrest High School</h1>
        <p class="site-subtitle">STAFF DASHBOARD</p>
      </div>
      <div class="header-spacer"></div>
      <span id="userBadge" class="admin-badge is-hidden"></span>
      <button id="signOutBtn" type="button" class="staff-link is-hidden">Sign out</button>
    </div>
  </header>

  <main class="page">
    <div id="gate" class="loading-state"><span class="spinner" aria-hidden="true"></span><span>Checking your access…</span></div>

    <div id="app" class="is-hidden">
      <p id="deniedMsg" class="dash-denied is-hidden"></p>

      <form id="quickForm" class="quick" role="search">
        <label for="quickQ" class="quick-label">Find a student</label>
        <input type="text" id="quickQ" placeholder="Admin number or name" autocomplete="off" />
        <button type="submit" class="btn btn-primary">Search</button>
      </form>

      <div class="dash-grid">
        <div>
          <section id="tiles" aria-label="Pages"></section>
          <section id="rosterPanel" class="panel is-hidden" aria-label="Student data">
            <h2 class="panel-title">Student data</h2>
            <p id="rosterInfo" class="empty-hint"></p>
            <label class="chk-inline"><input type="checkbox" id="rosterUrgent" /> Urgent: reload immediately, ignoring the 6-hour limit</label>
            <p id="rosterMsg" class="plan-msg"></p>
            <button type="button" id="rosterBtn" class="btn btn-primary">Refresh student data for everyone</button>
            <button type="button" id="indexBtn" class="btn">Rebuild roster index</button>
          </section>
        </div>

        <aside class="panel notices" aria-label="School notices">
          <div class="panel-row">
            <h2 class="panel-title">Notices</h2>
            <button type="button" id="noticeRefresh" class="btn btn-ghost">Refresh</button>
          </div>
          <p id="noticeMeta" class="empty-hint"></p>
          <div id="noticeList"></div>

          <form id="noticeForm" class="notice-form is-hidden" novalidate>
            <h3 class="pool-title">Post a notice</h3>
            <label for="nTitle">Title</label>
            <input type="text" id="nTitle" maxlength="80" autocomplete="off" />
            <label for="nBody">Message</label>
            <textarea id="nBody" rows="3" maxlength="500"></textarea>
            <div class="notice-row">
              <div><label for="nLevel">Importance</label>
                <select id="nLevel"><option value="info">Information</option><option value="important">Important</option><option value="urgent">Urgent</option></select></div>
              <div><label for="nExpires">Hide after (optional)</label><input type="date" id="nExpires" /></div>
            </div>
            <label>Show to (none ticked = everyone)</label>
            <div id="nAudience" class="notice-aud"></div>
            <p class="empty-hint">Notices are visible to all signed-in staff. Do not post learner or other confidential details.</p>
            <p id="noticeMsg" class="plan-msg"></p>
            <button type="submit" id="noticeBtn" class="btn btn-primary">Post notice</button>
          </form>
        </aside>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
